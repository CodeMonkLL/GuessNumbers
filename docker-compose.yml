services:

  mysql_db:
    container_name: guessnumbers-mysql_db
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: guess-my-pw
      MYSQL_DATABASE: number_guessing
      MYSQL_USER: user
      MYSQL_PASSWORD: guess-my-pw
    volumes:
      - mysql-data:/var/lib/mysql
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 3s
      retries: 20
      start_period: 15s
    ports:
      - "3306:3306"
    networks:
      - app-network

  backend:
    container_name: guessnumbers-backend
    build: ./backend
    depends_on:
      mysql_db:
        condition: service_healthy
    environment:
      DB_HOST: mysql_db
      DB_USER: user
      DB_PASSWORD: guess-my-pw
      SECRET_KEY: localhost
    ports:
      - "5000:5000"
    networks:
      - app-network

  frontend:
    container_name: guessnumbers-frontend
    build: ./frontend/guess-number
    ports:
      - "3000:3000"
    environment:
      BACKEND_URL: http://backend:5000
      WATCHPACK_POLLING: "true"
    volumes:
      - ./frontend/guess-number:/guess-number
      - /guess-number/node_modules
      - /guess-number/.next
    depends_on:
      - backend
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  mysql-data:
