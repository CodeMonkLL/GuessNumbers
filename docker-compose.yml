services:

  mysql_db:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: guess-my-pw
      MYSQL_DATABASE: number_guessing
      MYSQL_USER: user
      MYSQL_PASSWORD: guess-my-pw
    volumes:
      - mysql-data:/var/lib/mysql
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 3s
      retries: 20
      start_period: 15s
    ports:
      - "3306:3306"

  app:
    build:
      context: .
      dockerfile: backend/Dockerfile
    depends_on:
      mysql_db:
        condition: service_healthy
    environment:
      DB_HOST: mysql_db
      DB_USER: user
      DB_PASSWORD: guess-my-pw
      SECRET_KEY: localhost
    ports:
      - "5000:5000"

volumes:
  mysql-data:
